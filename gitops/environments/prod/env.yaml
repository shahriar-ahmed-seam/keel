# Production. Note `autoSync: false`: a merge here renders the manifests and
# marks the Application OutOfSync, but a human (or `keel promote --sync`) has to
# approve the actual rollout. Everything else about the flow is identical.
env: prod
cluster: https://kubernetes.default.svc
domain: somokolonlabs.com
autoSync: false
prune: false
selfHeal: true

apps:
  flywheel:
    enabled: true
    repoURL: https://github.com/shahriar-ahmed-seam/flywheel.git
    targetRevision: main
    path: infra/k8s/overlays/production
    namespace: flywheel-prod
    host: flywheel.somokolonlabs.com
    replicas: 3
    images:
      api: ghcr.io/shahriar-ahmed-seam/flywheel-api
      web: ghcr.io/shahriar-ahmed-seam/flywheel-web
    tag: v1.0.0

  sentinel:
    enabled: true
    repoURL: https://github.com/shahriar-ahmed-seam/sentinel.git
    targetRevision: main
    path: infra/k8s/overlays/production
    namespace: sentinel-prod
    host: sentinel.somokolonlabs.com
    replicas: 3
    images:
      gateway: ghcr.io/shahriar-ahmed-seam/sentinel-gateway
      web: ghcr.io/shahriar-ahmed-seam/sentinel-web
    tag: v1.0.0
