# Desired state for the dev environment. CI writes the `tag` fields here and
# nothing else; a promotion is a one-line diff with an author and a timestamp.
env: dev
cluster: https://kubernetes.default.svc
domain: dev.somokolonlabs.internal
autoSync: true
prune: true
selfHeal: true

apps:
  flywheel:
    enabled: true
    repoURL: https://github.com/shahriar-ahmed-seam/flywheel.git
    targetRevision: main
    path: infra/k8s/overlays/production
    namespace: flywheel-dev
    host: flywheel.dev.somokolonlabs.internal
    replicas: 1
    images:
      api: ghcr.io/shahriar-ahmed-seam/flywheel-api
      web: ghcr.io/shahriar-ahmed-seam/flywheel-web
    tag: main

  sentinel:
    enabled: true
    repoURL: https://github.com/shahriar-ahmed-seam/sentinel.git
    targetRevision: main
    path: infra/k8s/overlays/production
    namespace: sentinel-dev
    host: sentinel.dev.somokolonlabs.internal
    replicas: 1
    images:
      gateway: ghcr.io/shahriar-ahmed-seam/sentinel-gateway
      web: ghcr.io/shahriar-ahmed-seam/sentinel-web
    tag: main
