env: staging
cluster: https://kubernetes.default.svc
domain: staging.somokolonlabs.com
autoSync: true
prune: true
selfHeal: true

apps:
  flywheel:
    enabled: true
    repoURL: https://github.com/shahriar-ahmed-seam/flywheel.git
    targetRevision: main
    path: infra/k8s/overlays/production
    namespace: flywheel-staging
    host: flywheel.staging.somokolonlabs.com
    replicas: 2
    images:
      api: ghcr.io/shahriar-ahmed-seam/flywheel-api
      web: ghcr.io/shahriar-ahmed-seam/flywheel-web
    tag: sha-0000000

  sentinel:
    enabled: true
    repoURL: https://github.com/shahriar-ahmed-seam/sentinel.git
    targetRevision: main
    path: infra/k8s/overlays/production
    namespace: sentinel-staging
    host: sentinel.staging.somokolonlabs.com
    replicas: 2
    images:
      gateway: ghcr.io/shahriar-ahmed-seam/sentinel-gateway
      web: ghcr.io/shahriar-ahmed-seam/sentinel-web
    tag: sha-0000000
