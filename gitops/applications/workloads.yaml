# One ApplicationSet, N environments × M apps.
#
# The git generator reads every `gitops/environments/*/env.yaml`, so adding an
# environment is a directory, not a code change. Each application's manifests
# come from *its own repository* — this repo holds desired state, never a copy of
# someone else's Kubernetes YAML.
#
# Two things below live in `templatePatch` rather than `template`, and it is not a
# style choice. An ApplicationSet is parsed as YAML *before* any templating runs,
# and Go templates are then evaluated only inside string values. Block constructs
# like `range` and `if` in `template` are therefore not templating at all — they
# are a syntax error, which is exactly how this file used to fail validation.
# `templatePatch` is a string, so the whole block is templated as text and merged
# over the rendered Application. Argo documents it for precisely these two cases:
# a conditional `automated` policy, and generating a list.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Deleting an env file should remove its Applications, but never silently
  # delete the workloads. Argo asks for confirmation via the finalizer instead.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/shahriar-ahmed-seam/keel.git
              revision: main
              files:
                - path: gitops/environments/*/env.yaml
          - list:
              elements:
                - app: flywheel
                - app: sentinel

  template:
    metadata:
      name: "{{ .app }}-{{ .env }}"
      labels:
        keel.somokolonlabs.com/app: "{{ .app }}"
        keel.somokolonlabs.com/env: "{{ .env }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: keel
      source:
        repoURL: "{{ (index .apps .app).repoURL }}"
        targetRevision: "{{ (index .apps .app).targetRevision }}"
        path: "{{ (index .apps .app).path }}"
        kustomize:
          commonAnnotations:
            keel.somokolonlabs.com/env: "{{ .env }}"
            keel.somokolonlabs.com/revision: "{{ (index .apps .app).tag }}"
      destination:
        server: "{{ .cluster }}"
        namespace: "{{ (index .apps .app).namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PrunePropagationPolicy=foreground
          - RespectIgnoreDifferences=true
          # An app ships a ServiceMonitor, whose CRD arrives with the
          # kube-prometheus-stack add-on. On a fresh cluster the workloads are
          # dry-run before that add-on finishes, and the unknown kind fails the
          # whole sync with "one or more synchronization tasks are not valid" —
          # a chicken-and-egg that sync waves cannot fix across projects.
          - SkipDryRunOnMissingResource=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            keel.somokolonlabs.com/env: "{{ .env }}"
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
      # KEDA and HPAs own replica counts at runtime; Git owning them too would
      # produce a permanent OutOfSync fight.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
      revisionHistoryLimit: 10
      info:
        - name: environment
          value: "{{ .env }}"
        - name: url
          value: "https://{{ (index .apps .app).host }}"

  # The promotion surface: CI rewrites `tag` in env.yaml and Argo rewrites every
  # image reference in the overlay to match. Ranging over the map keeps an app
  # free to ship any number of images under any names — flywheel calls its server
  # image `api`, sentinel calls its `gateway` — without touching this file.
  #
  # `automated` has to be absent, not false, for a manual environment: its mere
  # presence is what turns auto-sync on. prod sets `autoSync: false` and so gets
  # rendered manifests plus an OutOfSync badge, waiting for a human.
  templatePatch: |
    spec:
      source:
        kustomize:
          images:
          {{- range $name, $image := (index .apps .app).images }}
            - "{{ $image }}:{{ (index $.apps $.app).tag }}"
          {{- end }}
    {{- if .autoSync }}
      syncPolicy:
        automated:
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
          allowEmpty: false
    {{- end }}
