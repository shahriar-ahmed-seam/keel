# The blast-radius boundary. Everything Argo CD manages for this platform lives
# in one project with an explicit allow-list, so a mistake in a manifest cannot
# reach a namespace or a cluster-scoped resource it has no business touching.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: keel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Somokolon Labs platform delivery

  sourceRepos:
    - https://github.com/shahriar-ahmed-seam/keel.git
    - https://github.com/shahriar-ahmed-seam/flywheel.git
    - https://github.com/shahriar-ahmed-seam/sentinel.git
    # Third-party charts are declared, never vendored.
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://kedacore.github.io/charts
    - https://argoproj.github.io/argo-helm
    - https://bitnami-labs.github.io/sealed-secrets

  destinations:
    # The root Application writes the ApplicationSets, and they live next to the
    # controller that reads them, so `argocd` has to be an allowed destination.
    # Leaving it out is not a tighter policy, it is a broken bootstrap: the root
    # app is rejected with InvalidSpecError, never syncs, and no ApplicationSet
    # is ever created, so nothing deploys at all. A real cluster run is what
    # caught this — no amount of schema validation would have.
    #
    # What keeps it narrow is that exactly one Application targets this
    # namespace, and its source is a fixed path holding only ApplicationSets.
    # A project-wide namespaceResourceWhitelist would be the stronger control
    # but it applies to every destination, so it would also forbid the
    # Deployments and Services the workloads legitimately need.
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: flywheel-*
    - server: https://kubernetes.default.svc
      namespace: sentinel-*
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
    - server: https://kubernetes.default.svc
      namespace: sealed-secrets

  # Cluster-scoped resources the platform genuinely needs.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: storage.k8s.io
      kind: StorageClass
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: monitoring.coreos.com
      kind: "*"
    - group: scheduling.k8s.io
      kind: PriorityClass

  namespaceResourceBlacklist:
    # Nothing in Git should be able to mint long-lived cluster credentials.
    - group: ""
      kind: ServiceAccount
      # Note: add exceptions per-app rather than widening this.

  orphanedResources:
    # Warn about resources in these namespaces that Git does not know about.
    warn: true

  roles:
    - name: read-only
      description: Dashboards and CI status checks
      policies:
        - p, proj:keel:read-only, applications, get, keel/*, allow
      groups:
        - somokolon:viewers
    - name: deployer
      description: CI promotion and rollback, no destructive project edits
      policies:
        - p, proj:keel:deployer, applications, get, keel/*, allow
        - p, proj:keel:deployer, applications, sync, keel/*, allow
        - p, proj:keel:deployer, applications, action/*, keel/*, allow
      groups:
        - somokolon:deployers
